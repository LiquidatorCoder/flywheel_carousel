# flywheel_carousel — verification tier + review routing.
#
# Built from what this repo actually contains (a published Flutter widget package with
# zero third-party dependencies, a two-test flutter_test suite, and an iOS-only demo app;
# no CI workflow, no Makefile, no script runner, no codegen, no android/ directory
# anywhere, and no network, auth, storage or crypto surface). Classes that would only make
# sense in a different kind of repo are absent on purpose — there is no native-build class
# because nothing here ships platform code of its own (example/ios/ is the demo's runner,
# not a package artifact), and no trust-boundary/session-auth class because this package
# has no trust boundary to cross.
#
# Read by tool/harness/lib/classify.mjs (tiers) and tool/harness/lib/reviewpolicy.mjs
# (review mode). Changing this file changes the verification policy fingerprint, which
# invalidates every existing verify.json — that is intended.

schema_version: 1
repo: flywheel_carousel
integration_branch: main

tiers:
  fast:
    description: Static checks only. Seconds. The default working loop.
    checks: [format, analyze]
  normal:
    description: fast + the widget-test suite and the demo app's own analysis.
    checks: [format, analyze, test, example_analyze]
  full:
    description: normal + the pub.dev release gate.
    checks: [format, analyze, test, example_analyze, publish_dry_run]

# First match wins, top to bottom. Paths are repo-relative, glob-matched.
classification:
  - match: "pubspec.yaml"
    tier: full
    why: >-
      SDK/Flutter constraints, the (empty) dependency list, the published version and the
      pub.dev metadata all live here.
  - match: "CHANGELOG.md"
    tier: full
    why: Part of the pub.dev release artifact; changed together with the version.
  - match: "LICENSE"
    tier: full
    why: Distribution terms of the published archive; pub validates its presence.
  - match: "lib/flywheel_carousel.dart"
    tier: full
    why: >-
      The public export barrel. It names exactly four symbols with explicit `show`
      clauses, so dropping or renaming one breaks every consumer's import — there is no
      wildcard export to soften it.
  - match: "lib/src/flywheel_physics.dart"
    tier: full
    why: >-
      FreewheelPhysics is exported and is subclassable ScrollPhysics — consumers wrap and
      tune it. Nothing in the test suite flings the carousel, so the suite cannot catch a
      regression here; the release gate is the only mechanical check this file gets.
  - match: "lib/**"
    tier: normal
    why: Package implementation. Consumed by real apps; the widget-test suite exercises it.
  - match: "test/**"
    tier: normal
    why: A change to a test changes what "passing" means — the suite must actually run.
  - match: "analysis_options.yaml"
    tier: normal
    why: >-
      The flutter_lints base plus seven hand-enabled rules. A change here re-scopes every
      analyze run on the package side. (example/ has its own options file and does not
      include this one.)
  - match: "tool/harness/**"
    tier: normal
    why: Verifier/gate logic. Also a policy file (see policy_files below).
  - match: ".claude/docs/routing.yaml"
    tier: normal
    why: This file. Policy change.
  - match: "AGENTS.md"
    tier: normal
    why: The rules agents work from.
  - match: "demo/**"
    tier: fast
    why: >-
      README media (three .gif, three .mov). Tracked and inside the published archive, but
      pubspec.yaml declares no `screenshots:` block, so pub validates nothing about them.
  - match: "example/**"
    tier: fast
    why: >-
      Demo app (publish_to: "none"), including its ios/ runner. Not depended on by lib/,
      and analysed on its own in the normal tier.
  - match: "README.md"
    tier: fast
    why: >-
      Documentation. Note it carries the API/defaults table that must stay in step with
      lib/src/flywheel_carousel.dart's constructor — see AGENTS.md.
  - match: "docs/**"
    tier: fast
    why: Agent-facing documentation; not shipped in the published archive.
  - match: ".claude/tasks/**"
    tier: fast
    why: Task bookkeeping — excluded from fingerprints entirely.
  - match: ".dart_tool/**"
    tier: fast
    why: >-
      Tracked by accident in this repo's initial commit and rewritten by every
      `flutter pub get`. Excluded from fingerprints; see AGENTS.md's generated-files trap.
  - match: "pubspec.lock"
    tier: fast
    why: Generated by pub resolution, tracked here. Same trap as .dart_tool/.
  - match: "*"
    tier: fast
    why: Default floor. Nothing in this repo is verification-exempt.

# Independent review is required only where a mistake escapes this repository. For a
# pub.dev widget package with no dependencies and no platform surface, that means exactly
# one thing: what consumers compile against, and what their UI looks like after upgrading.
review:
  default_mode: none
  rules:
    - match: "pubspec.yaml"
      mode: standard
      why: Version, SDK/Flutter constraints and publish metadata — the release path.
    - match: "lib/flywheel_carousel.dart"
      mode: standard
      why: >-
        Four explicit `show` clauses are the entire public surface. A changed export is a
        compile break downstream.
    - match: "lib/src/flywheel_carousel.dart"
      mode: standard
      why: >-
        FlywheelCarousel's thirteen constructor parameters and their default values are
        the package's public contract, documented in README.md's API table. Changing a
        default silently restyles every consumer's carousel on upgrade.
    - match: "lib/src/flywheel_physics.dart"
      mode: standard
      why: >-
        FreewheelPhysics is exported for consumers to wrap or subclass, and its
        createBallisticSimulation override has no test coverage at all.
    - match: "lib/src/flywheel_item_card.dart"
      mode: standard
      why: >-
        FlywheelItemCard is an exported widget with twelve parameters host apps construct
        directly; its defaults are its layout contract.
    - match: "LICENSE"
      mode: standard
      why: Distribution terms of a published artifact.

# Files whose content defines "what verification means" here. Hashed into every
# verify.json's verification_policy_fingerprint.
policy_files:
  - tool/harness/verify
  - tool/harness/lib/classify.mjs
  - tool/harness/lib/reviewpolicy.mjs
  - .claude/docs/routing.yaml
  - analysis_options.yaml

# Shared resources a worker may need to serialize on. This repo has no codegen step
# (no build_runner, no dependency at all) and no simulator/device pool, so neither
# appears here.
lock_resources:
  - dependency-resolution   # flutter pub get / upgrade — rewrites tracked lockfiles here
  - repo-format             # dart format . (rewrites files repo-wide)
  - release                 # flutter pub publish
